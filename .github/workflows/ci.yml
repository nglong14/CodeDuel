name: CI
 
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
 
env:
  GO_VERSION: '1.26.6'
 
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
 
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
 
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
 
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
 
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
 
      - name: Verify go.mod/go.sum
        run: go mod verify
 
      - name: Build
        run: go build -v ./...

      - name: Build sandbox images
        run: make sandbox-images
 
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
 
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
 
      - name: Run tests with race detector
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic
 
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  k8s-manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # kubectl bundles Kustomize (kubectl kustomize == kustomize build); no
      # separate kustomize install or live cluster is needed to render.
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Render dev overlay
        run: kubectl kustomize deploy/k8s/overlays/dev > /tmp/dev.rendered.yaml

      - name: Render prod overlay
        run: kubectl kustomize deploy/k8s/overlays/prod > /tmp/prod.rendered.yaml

      - name: Validate rendered manifests against the Kubernetes OpenAPI schema
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
          "$(go env GOPATH)/bin/kubeconform" -strict -summary -ignore-missing-schemas /tmp/dev.rendered.yaml /tmp/prod.rendered.yaml

  infra-check:
    name: Infrastructure (Pulumi & Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'infra/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r infra/requirements.txt

      - name: Lint infra code with ruff
        run: ruff check infra/

      - name: Run infra unit tests
        run: pytest -v infra/tests

  plan:
    name: Plan (AWS preview and cluster diff)
    runs-on: ubuntu-latest
    needs: [k8s-manifests, infra-check]
    # Only same-repository pull requests. A fork PR must never get credentials,
    # so fork contributors get the five hermetic jobs above and nothing more.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      id-token: write # required to request the OIDC token
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      PULUMI_SKIP_UPDATE_CHECK: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pulumi.yaml pins runtime.options.virtualenv to infra/.venv, so the
      # program only imports its providers out of that venv - not out of
      # whatever setup-python put on PATH.
      - name: Create infra virtualenv
        run: make infra-deps

      - name: Install Pulumi CLI
        env:
          PULUMI_VERSION: 3.263.0
        run: |
          curl -fsSL https://get.pulumi.com | sh -s -- --version "$PULUMI_VERSION"
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Preview all three stacks
        run: |
          {
            echo '## Pulumi preview'
            for target in "shared:shared" "env:dev" "env:prod"; do
              dir="${target%%:*}"
              stack="${target##*:}"
              echo "<details><summary><code>$dir / $stack</code></summary>"
              echo '```'
              (cd "infra/$dir" && pulumi preview --stack "$stack" --diff --non-interactive 2>&1)
              echo '```'
              echo '</details>'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: azure/setup-kubectl@v4

      - name: Diff both overlays against the cluster
        run: |
          cluster="$(cd infra/shared && pulumi stack output --stack shared eks_cluster_name)"
          registry="$(cd infra/shared && pulumi stack output --stack shared ecr_repository_urls --json | jq -r '.codeduel' | cut -d/ -f1)"
          aws eks update-kubeconfig --name "$cluster" --region "$AWS_REGION"
          {
            echo '## kubectl diff'
            for env_name in dev prod; do
              overlay="$(infra/scripts/render_overlay.sh "$env_name" "$registry" "${GITHUB_SHA::7}" "$(mktemp -d)/render")"
              echo "<details><summary><code>$env_name</code></summary>"
              echo '```diff'
              # A diff is the expected outcome on any PR that touches manifests,
              # so a non-zero exit here is information, not failure.
              kubectl diff -k "$overlay" 2>&1 || true
              echo '```'
              echo '</details>'
            done
          } >> "$GITHUB_STEP_SUMMARY"

 
