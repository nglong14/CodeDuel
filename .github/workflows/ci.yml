name: CI
 
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
 
env:
  GO_VERSION: '1.26.6'
 
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
 
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
 
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
 
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
 
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
 
      - name: Verify go.mod/go.sum
        run: go mod verify
 
      - name: Build
        run: go build -v ./...

      - name: Build sandbox images
        run: make sandbox-images
 
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
 
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
 
      - name: Run tests with race detector
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic
 
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          args: ./...

  k8s-manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # kubectl bundles Kustomize (kubectl kustomize == kustomize build); no
      # separate kustomize install or live cluster is needed to render.
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Render dev overlay
        run: kubectl kustomize deploy/k8s/overlays/dev > /tmp/dev.rendered.yaml

      - name: Render prod overlay
        run: kubectl kustomize deploy/k8s/overlays/prod > /tmp/prod.rendered.yaml

      - name: Validate rendered manifests against the Kubernetes OpenAPI schema
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
          "$(go env GOPATH)/bin/kubeconform" -strict -summary -ignore-missing-schemas /tmp/dev.rendered.yaml /tmp/prod.rendered.yaml

 
