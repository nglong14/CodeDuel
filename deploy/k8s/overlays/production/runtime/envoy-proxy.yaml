apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: codeduel-edge
  labels:
    app.kubernetes.io/name: codeduel
    app.kubernetes.io/part-of: codeduel
    app.kubernetes.io/component: edge
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        # MUST EDIT before the first apply: the edge is plain HTTP, so it must never be
        # open to 0.0.0.0/0. 192.0.2.0/24 is a documentation range and reaches nobody,
        # which fails closed on purpose. Replace it with the client networks that need
        # access, or set type: ClusterIP and use kubectl port-forward.
        loadBalancerSourceRanges:
          - 192.0.2.0/24
        # Some providers ignore loadBalancerSourceRanges and require an annotation or a
        # security group instead. Verify the restriction is actually enforced before
        # announcing the address.
        annotations: {}
  telemetry:
    accessLog:
      settings:
        # REQ_WITHOUT_QUERY keeps the token out of the logs when a client uses the
        # /ws?token= fallback. If the installed Envoy Gateway version rejects this
        # format, set accessLog.disable: true instead of logging the query string.
        - format:
            type: Text
            text: |
              [%START_TIME%] "%REQ(:METHOD)% %REQ_WITHOUT_QUERY(X-ENVOY-ORIGINAL-PATH?:PATH)% %PROTOCOL%" %RESPONSE_CODE% %RESPONSE_FLAGS% %BYTES_RECEIVED% %BYTES_SENT% %DURATION% "%REQ(X-FORWARDED-FOR)%" "%UPSTREAM_HOST%"
          sinks:
            - type: File
              file:
                path: /dev/stdout
