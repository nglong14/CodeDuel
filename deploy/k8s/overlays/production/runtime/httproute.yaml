apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: codeduel-backend
  labels:
    app.kubernetes.io/name: codeduel
    app.kubernetes.io/part-of: codeduel
    app.kubernetes.io/component: edge
spec:
  # No hostnames: this route matches whatever Host the client sends to the load balancer
  # address. No URLRewrite and no path modifier anywhere, so Gateway sees the original
  # path and Host, which is what Gorilla's default same-origin WebSocket check needs.
  parentRefs:
    - name: codeduel-edge
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: codeduel-gateway
          port: 80
    - matches:
        - path:
            type: Exact
            value: /ws
      backendRefs:
        - name: codeduel-gateway
          port: 80
      timeouts:
        # 0s disables the request timeout so a duel WebSocket is not cut off mid-match.
        request: 0s
# /healthz and /readyz are deliberately unrouted. Query them from inside the cluster
# through the codeduel-gateway Service.
