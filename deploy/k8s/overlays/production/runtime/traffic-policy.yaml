apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: codeduel-edge-client
  labels:
    app.kubernetes.io/name: codeduel
    app.kubernetes.io/part-of: codeduel
    app.kubernetes.io/component: edge
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: codeduel-edge
  timeout:
    http:
      # Gateway pings each WebSocket every 54s, so anything above 120s is safe. These are
      # downstream (browser to Envoy) timeouts; MUST VERIFY the field names against the
      # installed Envoy Gateway version.
      idleTimeout: 1h
      streamIdleTimeout: 1h
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: codeduel-edge-backend
  labels:
    app.kubernetes.io/name: codeduel
    app.kubernetes.io/part-of: codeduel
    app.kubernetes.io/component: edge
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: codeduel-edge
  timeout:
    http:
      # Upstream (Envoy to Gateway pods) idle timeouts, same reasoning.
      connectionIdleTimeout: 1h
      streamIdleTimeout: 1h
