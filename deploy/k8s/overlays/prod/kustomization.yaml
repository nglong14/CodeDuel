apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: codeduel-prod

resources:
  - ../../base

configMapGenerator:
  - name: codeduel-config
    behavior: merge
    envs:
      - config.env

patches:
  - path: ingress-host.yaml
  - path: gateway-replicas.yaml

# Pinned by CI to the same immutable image digest dev already ran, promoted
# behind manual approval; `latest` here is a local-render placeholder only.
images:
  - name: codeduel
    newName: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/codeduel
    newTag: latest

labels:
  - pairs:
      app.kubernetes.io/environment: prod
    includeSelectors: false
