apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: codeduel-prod

resources:
  - ../../base

configMapGenerator:
  - name: codeduel-config
    behavior: merge
    envs:
      - config.env

patches:
  - path: ingress-host.yaml
  - path: gateway-replicas.yaml

# Promotes the same immutable release tags dev ran, behind manual approval.
images:
  - name: codeduel
    newName: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/codeduel
    newTag: RELEASE_TAG

labels:
  - pairs:
      app.kubernetes.io/environment: prod
    includeSelectors: false
