apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: codeduel-edge
  labels:
    app.kubernetes.io/name: codeduel
    app.kubernetes.io/part-of: codeduel
    app.kubernetes.io/component: edge
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        # Staging has no external address at all. Reach it with:
        #   kubectl -n codeduel-staging port-forward svc/codeduel-gateway 8080:80
        # Switch to an internal LoadBalancer only when a VPN or bastion path exists, by
        # setting type: LoadBalancer plus the provider annotation:
        #   AWS   service.beta.kubernetes.io/aws-load-balancer-scheme: internal
        #   GCP   networking.gke.io/load-balancer-type: Internal
        #   Azure service.beta.kubernetes.io/azure-load-balancer-internal: "true"
        # Never expose staging publicly: the edge is plain HTTP.
        type: ClusterIP
  telemetry:
    accessLog:
      settings:
        # REQ_WITHOUT_QUERY keeps the token out of the logs when a client uses the
        # /ws?token= fallback. If the installed Envoy Gateway version rejects this
        # format, set accessLog.disable: true instead of logging the query string.
        - format:
            type: Text
            text: |
              [%START_TIME%] "%REQ(:METHOD)% %REQ_WITHOUT_QUERY(X-ENVOY-ORIGINAL-PATH?:PATH)% %PROTOCOL%" %RESPONSE_CODE% %RESPONSE_FLAGS% %BYTES_RECEIVED% %BYTES_SENT% %DURATION% "%REQ(X-FORWARDED-FOR)%" "%UPSTREAM_HOST%"
          sinks:
            - type: File
              file:
                path: /dev/stdout
