apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: codeduel-edge
  labels:
    app.kubernetes.io/name: codeduel
    app.kubernetes.io/part-of: codeduel
    app.kubernetes.io/component: edge
spec:
  # MUST VERIFY: replace with the GatewayClass name created by the installed Envoy
  # Gateway (kubectl get gatewayclass).
  gatewayClassName: envoy-gateway
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: codeduel-edge
  listeners:
    # Exactly one listener. No TLS, no hostname, no port 443, and no HTTPS redirect:
    # there is no domain and therefore no publicly trusted certificate. Omitting
    # hostname is deliberate; clients connect to the load balancer address, and a
    # hostname match would reject every request.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
