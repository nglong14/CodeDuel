apiVersion: batch/v1
kind: Job
metadata:
  name: codeduel-migrate
  labels:
    app.kubernetes.io/name: codeduel
    app.kubernetes.io/part-of: codeduel
    app.kubernetes.io/component: migrate
spec:
  # A Job's pod template is immutable, so a release deletes this Job and recreates it.
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codeduel
        app.kubernetes.io/part-of: codeduel
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/nglong14/codeduel-app:placeholder
          args: ["--role=migrate", "--direction=up"]
          # Only the migration DSN. No Redis URL and no JWT secret: the migrate role never
          # constructs a Redis client, and config.Load defaults cover the rest.
          env:
            - name: APP_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_FORMAT
              value: "json"
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: codeduel-migration
                  key: POSTGRES_DSN
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
