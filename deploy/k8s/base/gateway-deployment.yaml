apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: codeduel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
    spec:
      # terminationGracePeriodSeconds + preStop cover the ALB deregistration
      # window and the 10s WebSocket drain in gateway.Run (connectionDrainTimeout).
      terminationGracePeriodSeconds: 35
      containers:
        - name: gateway
          image: codeduel
          args: ["--role=gateway"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: codeduel-config
            - secretRef:
                name: codeduel-secrets
          lifecycle:
            preStop:
              # Native sleep hook (supported in K8s 1.29+ / 1.30+), requiring no
              # shell or binary in the distroless image. Delays SIGTERM so the
              # AWS Load Balancer Controller can deregister the pod IP from the
              # target group before the Go server stops accepting connections.
              sleep:
                seconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
  annotations:
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=60
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
