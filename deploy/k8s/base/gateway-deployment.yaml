apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: codeduel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
    spec:
      # terminationGracePeriodSeconds + preStop cover registry.CloseAll and the
      # 10s WebSocket drain in gateway.Run (connectionDrainTimeout); the ALB
      # target group's deregistration delay (set via Ingress annotation on the
      # Service, >=60s) must exceed this so in-flight sockets are not cut by
      # the load balancer before the pod finishes draining.
      terminationGracePeriodSeconds: 20
      containers:
        - name: gateway
          image: codeduel
          args: ["--role=gateway"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: codeduel-config
            - secretRef:
                name: codeduel-secrets
          lifecycle:
            preStop:
              exec:
                # Give in-flight requests/WebSocket drain a head start before
                # the container receives SIGTERM.
                command: ["/bin/sh", "-c", "sleep 5"]
          # Start period covers the PostgreSQL/Redis pings readyz performs;
          # failureThreshold * periodSeconds must exceed dependency startup.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
  annotations:
    # ALB target group deregistration delay: must be >= the drain window
    # (terminationGracePeriodSeconds + connectionDrainTimeout) so the load
    # balancer stops sending new requests to a pod before it finishes closing
    # existing WebSocket connections.
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=60
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
