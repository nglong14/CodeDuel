# PLACEHOLDER ONLY. Real deployments never apply this file: the Pulumi
# codeduel-env stack (Task 5) creates the real `codeduel-secrets` Secret per
# environment — a generated JWT_SECRET (>=32 bytes), the RDS DSN with
# sslmode=require, and the ElastiCache URL with the environment's Redis DB
# index — directly through its Kubernetes provider, so a real secret value
# never lands in this repository or in `kubectl apply -k` input.
#
# This file exists only so `kubectl kustomize` / `kustomize build` can render
# a complete, schema-valid manifest set in CI and in local dry runs, since
# every base Deployment references `codeduel-secrets` via secretRef.
apiVersion: v1
kind: Secret
metadata:
  name: codeduel-secrets
  annotations:
    codeduel.example/placeholder: "true"
type: Opaque
stringData:
  JWT_SECRET: placeholder-not-a-real-secret-please-replace
  POSTGRES_DSN: postgres://codeduel:codeduel@localhost:5433/codeduel?sslmode=disable
  REDIS_URL: redis://localhost:6379/0
