apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-deny-all
  labels:
    app.kubernetes.io/name: judge
    app.kubernetes.io/part-of: codeduel
spec:
  # Selects the transient submission Job pods created by Judge.
  # Requires CNI NetworkPolicy enforcement (enabled in the shared EKS stack).
  # Verify denied traffic on real sandbox pods before admitting public submissions;
  # rendering this policy alone does not prove isolation.
  podSelector:
    matchLabels:
      com.codeduel.sandbox: "true"
  policyTypes:
    - Ingress
    - Egress
