apiVersion: v1
kind: ServiceAccount
metadata:
  name: judge
  labels:
    app.kubernetes.io/name: judge
---
# Namespaced Role only: no cluster-wide access, and no Secret/ConfigMap verbs
# beyond what the Deployment's own envFrom already grants via the kubelet.
# KubernetesJobExecutor only ever creates/watches/deletes the submission Jobs
# and pods it owns, plus reads their logs to grade output.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: judge
  labels:
    app.kubernetes.io/name: judge
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: judge
  labels:
    app.kubernetes.io/name: judge
subjects:
  - kind: ServiceAccount
    name: judge
roleRef:
  kind: Role
  name: judge
  apiGroup: rbac.authorization.k8s.io
