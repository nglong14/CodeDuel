apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeduel-reaper
  labels:
    app.kubernetes.io/name: codeduel
    app.kubernetes.io/part-of: codeduel
    app.kubernetes.io/component: reaper
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: codeduel
      app.kubernetes.io/component: reaper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codeduel
        app.kubernetes.io/part-of: codeduel
        app.kubernetes.io/component: reaper
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        # No Service and no HTTP probes. Overlap during a rollout is safe because Reaper
        # holds a PostgreSQL advisory lock. The runtime DSN must not point at a
        # transaction-mode pooler: advisory locking requires session affinity.
        - name: reaper
          image: ghcr.io/nglong14/codeduel-app:placeholder
          args: ["--role=reaper"]
          envFrom:
            - configMapRef:
                name: codeduel-runtime-config
          env:
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: codeduel-runtime
                  key: POSTGRES_DSN
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: codeduel-runtime
                  key: REDIS_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
