apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeduel-gateway
  labels:
    app.kubernetes.io/name: codeduel
    app.kubernetes.io/part-of: codeduel
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: codeduel
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codeduel
        app.kubernetes.io/part-of: codeduel
        app.kubernetes.io/component: gateway
    spec:
      automountServiceAccountToken: false
      # Gateway closes WebSockets on SIGTERM: a 5s HTTP shutdown followed by a bounded
      # 10s connection drain. 30s leaves headroom before SIGKILL.
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: codeduel
              app.kubernetes.io/component: gateway
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: codeduel
              app.kubernetes.io/component: gateway
      containers:
        - name: gateway
          image: ghcr.io/nglong14/codeduel-app:placeholder
          args: ["--role=gateway"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: codeduel-runtime-config
          env:
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: codeduel-runtime
                  key: POSTGRES_DSN
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: codeduel-runtime
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: codeduel-auth
                  key: JWT_SECRET
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
