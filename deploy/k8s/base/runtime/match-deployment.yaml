apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeduel-match
  labels:
    app.kubernetes.io/name: codeduel
    app.kubernetes.io/part-of: codeduel
    app.kubernetes.io/component: match
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: codeduel
      app.kubernetes.io/component: match
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codeduel
        app.kubernetes.io/part-of: codeduel
        app.kubernetes.io/component: match
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        # No Service and no HTTP probes. Redis and PostgreSQL coordinate the work, so
        # brief pod overlap during a rollout is safe; dependency failures surface through
        # logs and managed-service monitoring.
        - name: match
          image: ghcr.io/nglong14/codeduel-app:placeholder
          args: ["--role=match"]
          envFrom:
            - configMapRef:
                name: codeduel-runtime-config
          env:
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: codeduel-runtime
                  key: POSTGRES_DSN
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: codeduel-runtime
                  key: REDIS_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
