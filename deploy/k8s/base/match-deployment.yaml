apiVersion: apps/v1
kind: Deployment
metadata:
  name: match
  labels:
    app.kubernetes.io/name: match
    app.kubernetes.io/part-of: codeduel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: match
  template:
    metadata:
      labels:
        app.kubernetes.io/name: match
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: match
          image: codeduel
          args: ["--role=match"]
          envFrom:
            - configMapRef:
                name: codeduel-config
            - secretRef:
                name: codeduel-secrets
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault
