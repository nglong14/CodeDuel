apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: codeduel

resources:
  - namespace.yaml
  - runtimeclass.yaml
  - secret-placeholder.yaml
  - migrate-job.yaml
  - gateway-deployment.yaml
  - match-deployment.yaml
  - reaper-deployment.yaml
  - judge-deployment.yaml
  - judge-rbac.yaml
  - ingress.yaml

configMapGenerator:
  - name: codeduel-config
    envs:
      - config.env

# JUDGE_K8S_NAMESPACE must equal the namespace above; RuntimeClass is
# cluster-scoped and intentionally left outside the namespace transform by
# Kustomize's own convention (cluster-scoped resources are never namespaced).
images:
  - name: codeduel
    newName: codeduel
    newTag: latest

labels:
  - pairs:
      app.kubernetes.io/part-of: codeduel
    includeSelectors: false
