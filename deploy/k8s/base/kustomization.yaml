apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: codeduel

resources:
  - sandbox-networkpolicy.yaml
  - gateway-deployment.yaml
  - match-deployment.yaml
  - reaper-deployment.yaml
  - judge-deployment.yaml
  - judge-rbac.yaml
  - ingress.yaml
  - migrate-job.yaml

configMapGenerator:
  - name: codeduel-config
    envs:
      - config.env
    options:
      labels:
        app.kubernetes.io/name: configuration

images:
  - name: codeduel
    newName: codeduel
    newTag: RELEASE_TAG

labels:
  - pairs:
      app.kubernetes.io/part-of: codeduel
    includeSelectors: false
